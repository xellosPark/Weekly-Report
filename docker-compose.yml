services:
  db:
    image: postgres:17-alpine
    container_name: weekly-db
    restart: unless-stopped
    env_file:
      - server/.env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres_20260927_011044.dump:/docker-entrypoint-initdb.d/dump.dump:ro
      - ./db/init/01-restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: weekly-server
    restart: unless-stopped
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4001:4001"

  client:
    build: ./client
    container_name: weekly-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  db_data:
